[tool.ruff]
line-length = 88
target-version = "py310"

exclude = [
    ".venv",
    "venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "B",  # bugbear
    "I",  # imports (isort)
    "UP", # pyupgrade
]

ignore = [
    "E501", # line length — Black керує
]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.black]
line-length = 88
target-version = ["py310"]

exclude = '''
(
  /(
      \.venv
    | venv
    | alembic/versions
    | migrations
  )/
)
'''